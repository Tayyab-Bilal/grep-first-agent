[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grep-first-agent"
version = "0.1.0"
description = "Agentic retrieval with string matching instead of vector RAG (clean-room demo)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "langchain-core>=0.3"]

[project.optional-dependencies]
redis = ["redis>=5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis[lua]>=2.20", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/grep_first_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["SIM905"]
